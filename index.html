<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111114">
  <meta name="description" content="KYBER ALISA PROJECTS">
  <title>KYBER ALISA PROJECTS</title>
  <style>
    :root{--bg:#111114;--panel:#19191e;--line:#34343b;--fg:#f6f3ee;--muted:#9999a2;--accent:#ff9148}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Arial,sans-serif}
    body{min-height:100vh;overflow:hidden}
    .page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
    .left{display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,96px);position:relative;z-index:2}
    h1{margin:0 0 46px;font-size:clamp(50px,6.7vw,104px);line-height:.88;letter-spacing:-.065em;font-weight:850}
    h1 span{display:block;color:var(--accent)}
    nav{display:grid;gap:12px;max-width:610px}
    .project{min-height:100px;padding:0 26px;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:inherit;text-decoration:none;transition:.18s ease}
    .project:hover{border-color:var(--accent);background:#222127;transform:translateX(6px)}
    .num{font:14px Consolas,monospace;color:var(--accent)}
    .name{font-size:clamp(24px,2.5vw,38px);font-weight:800;letter-spacing:-.035em}
    .arrow{font-size:28px;color:var(--muted);transition:.18s ease}
    .project:hover .arrow{color:var(--accent);transform:translateX(4px)}
    .portrait{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 48% 56%,#9f4c2b30 0%,transparent 63%)}
    .portrait:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,transparent 16%,transparent 86%,#11111455 100%);pointer-events:none}
    .portrait img{position:absolute;height:105vh;max-width:none;width:auto;left:50%;bottom:-3vh;transform:translateX(-50%);filter:drop-shadow(0 20px 34px #0007)}
    .sig{position:absolute;right:24px;bottom:20px;z-index:3;color:#ffffff50;font:12px Consolas,monospace;letter-spacing:.12em}
    @media(max-width:760px){body{overflow:auto}.page{display:block}.left{min-height:62vh;padding:42px 22px 28px}h1{margin-bottom:28px}.project{min-height:82px;padding:0 18px;grid-template-columns:34px 1fr auto}.portrait{height:50vh}.portrait img{height:72vh;bottom:-18vh}.portrait:after{background:linear-gradient(180deg,var(--bg),transparent 18%,transparent 80%,var(--bg))}}
  </style>
</head>
<body>
  <main class="page">
    <section class="left">
      <h1>KYBER ALISA <span>PROJECTS</span></h1>
      <nav aria-label="Проекты">
        <a class="project" href="./pozor/"><span class="num">01</span><span class="name">ПОЗОР</span><span class="arrow">→</span></a>
        <a class="project" href="./timurids/"><span class="num">02</span><span class="name">ТИМУРИДЫ</span><span class="arrow">→</span></a>
        <a class="project" href="./bl-test/"><span class="num">03</span><span class="name">ТЕСТ ПО БЛ</span><span class="arrow">→</span></a>
      </nav>
    </section>
    <section class="portrait" aria-label="Кибер Алиса">
      <img id="alisa" alt="Кибер Алиса">
      <div class="sig">KYBER ALISA / 88</div>
    </section>
  </main>
  <script>
    const source='https://raw.githubusercontent.com/KyberAlisa88/KyberAlisa88.github.io/eb75ec81e26ac2b2213f4383a7fbd7bbc2f37368/index.html';
    fetch(source).then(r=>r.text()).then(t=>{
      const m=t.match(/data:image\/png;base64,[A-Za-z0-9+/=]+/);
      if(m) document.getElementById('alisa').src=m[0];
    });
  </script>
</body>
</html>
