<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d10">
  <meta name="description" content="KYBER ALISA PROJECTS — Позор, Тимуриды и тест по Бесконечному лету.">
  <title>KYBER ALISA PROJECTS</title>
  <style>
    :root {
      --bg: #0d0d10;
      --panel: #151519;
      --panel-hover: #1d1d22;
      --line: #2e2e35;
      --text: #f5f3ef;
      --muted: #9d9da6;
      --accent: #ff8a3d;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      width: min(980px, calc(100% - 32px));
      padding: 64px 0;
    }

    h1 {
      margin: 0 0 42px;
      font-size: clamp(42px, 8vw, 92px);
      line-height: .92;
      letter-spacing: -.06em;
      font-weight: 850;
    }

    h1 span { color: var(--accent); }

    .projects {
      display: grid;
      gap: 14px;
    }

    .project {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 20px;
      min-height: 118px;
      padding: 24px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: .18s ease;
    }

    .project:hover {
      background: var(--panel-hover);
      border-color: var(--accent);
      transform: translateX(6px);
    }

    .num {
      color: var(--accent);
      font-family: Consolas, monospace;
      font-size: 16px;
    }

    .name {
      font-size: clamp(27px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -.035em;
    }

    .arrow {
      color: var(--muted);
      font-size: 30px;
      transition: .18s ease;
    }

    .project:hover .arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    footer {
      margin-top: 32px;
      color: #66666f;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .wrap { padding: 40px 0; }
      h1 { margin-bottom: 30px; }
      .project {
        grid-template-columns: 40px 1fr auto;
        gap: 12px;
        min-height: 96px;
        padding: 20px;
      }
      .arrow { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>KYBER ALISA <span>PROJECTS</span></h1>

    <nav class="projects" aria-label="Проекты">
      <a class="project" href="./pozor/">
        <span class="num">01</span>
        <span class="name">ПОЗОР</span>
        <span class="arrow">→</span>
      </a>

      <a class="project" href="./timurids/">
        <span class="num">02</span>
        <span class="name">ТИМУРИДЫ</span>
        <span class="arrow">→</span>
      </a>

      <a class="project" href="./bl-test/">
        <span class="num">03</span>
        <span class="name">ТЕСТ ПО БЛ</span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <footer>KyberAlisa88 / GitHub Pages</footer>
  </main>
</body>
</html>
